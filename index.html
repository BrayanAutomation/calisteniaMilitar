<title>Protocolo 21</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#eae3ce; --surface:#f7f2e5; --surface-2:#ddd4b4; --ink:#2a2418; --ink-dim:#6f6650;
    --line:#c7bd9a; --accent:#c2661b; --accent-ink:#fff8ec;
    --type-fuerza:#5f7248; --type-hiit:#a13f2b; --type-mixto:#3f5568;
    --shadow:0 1px 0 rgba(30,24,10,.08);
    --font-display:'Big Shoulders Stencil',Impact,'Arial Narrow',sans-serif;
    --font-body:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121108; --surface:#1c1a11; --surface-2:#262319; --ink:#ece4cf; --ink-dim:#a89c7c;
      --line:#3b3624; --accent:#e2952f; --accent-ink:#1a1508;
      --type-fuerza:#8ca36c; --type-hiit:#d6684a; --type-mixto:#7f9cb3;
      --shadow:0 1px 0 rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#121108; --surface:#1c1a11; --surface-2:#262319; --ink:#ece4cf; --ink-dim:#a89c7c;
    --line:#3b3624; --accent:#e2952f; --accent-ink:#1a1508;
    --type-fuerza:#8ca36c; --type-hiit:#d6684a; --type-mixto:#7f9cb3;
    --shadow:0 1px 0 rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;}
  h1,h2,h3{margin:0;text-wrap:balance;}
  button{font-family:inherit;}
  .btn:focus-visible,button:focus-visible,.day-card:focus-visible,.check-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:40px;}

  /* ---- top bar ---- */
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 14px;border-bottom:1px solid var(--line);}
  .brand-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .brand{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,7.5vw,30px);letter-spacing:.01em;text-transform:uppercase;line-height:.95;}
  .brand em{display:block;font-style:normal;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;color:var(--ink-dim);font-weight:400;text-transform:uppercase;margin-top:3px;}
  .operator-btn{background:var(--surface);border:1px solid var(--line);padding:7px 10px;display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11.5px;color:var(--ink);cursor:pointer;flex-shrink:0;}
  .operator-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
  .segbar{display:flex;gap:3px;margin-top:14px;}
  .segbar i{flex:1;height:7px;border-radius:1px;background:var(--surface-2);border:1px solid var(--line);}
  .segbar i.done{background:var(--accent);border-color:var(--accent);}
  .stats-row{display:flex;gap:18px;margin-top:9px;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-dim);}
  .stats-row b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}

  .tip-bar{margin:14px 16px 0;padding:10px 12px;background:var(--surface-2);border:1px dashed var(--line);font-size:12.5px;color:var(--ink-dim);display:flex;gap:10px;align-items:flex-start;line-height:1.4;}
  .tip-bar button{margin-left:auto;background:none;border:none;color:var(--ink-dim);cursor:pointer;font-size:15px;line-height:1;padding:0 2px;flex-shrink:0;}

  /* ---- day list ---- */
  .day-list{display:flex;flex-direction:column;gap:11px;padding:16px;}
  .day-card{position:relative;display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);text-align:left;padding:0;box-shadow:var(--shadow);width:100%;cursor:pointer;}
  .day-card:active{transform:translateY(1px);}
  .day-card .type-bar{width:6px;flex-shrink:0;}
  .day-card .body{flex:1;padding:11px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .row1{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .day-num{font-family:var(--font-display);font-size:22px;font-weight:800;color:var(--ink-dim);line-height:1;}
  .day-card.done .day-num{color:var(--accent);}
  .protocol-name{font-weight:600;font-size:14.5px;line-height:1.25;}
  .meta-row{display:flex;gap:9px;align-items:center;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-dim);flex-wrap:wrap;}
  .type-chip{font-size:9.5px;font-weight:600;letter-spacing:.06em;padding:2px 6px;border-radius:2px;color:#fff8ec;}
  .diff-dots{display:inline-flex;gap:2px;}
  .diff-dots i{width:5px;height:5px;border-radius:50%;background:var(--line);display:block;}
  .diff-dots i.on{background:var(--ink-dim);}
  .done-badge{position:absolute;top:8px;right:10px;font-family:var(--font-mono);font-size:9.5px;color:var(--accent);letter-spacing:.08em;}

  /* ---- sheet (day detail) ---- */
  .sheet{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);visibility:hidden;}
  .sheet.open{transform:translateY(0);visibility:visible;}
  @media (prefers-reduced-motion: reduce){.sheet{transition:none;}}
  .sheet-header{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0;}
  .back-btn{background:none;border:none;color:var(--ink);font-family:var(--font-mono);font-size:12.5px;letter-spacing:.05em;display:flex;align-items:center;gap:6px;padding:4px 0;cursor:pointer;text-transform:uppercase;}
  .sheet-daynum{font-family:var(--font-display);font-size:clamp(38px,15vw,52px);font-weight:800;line-height:.9;margin-top:6px;}
  .sheet-protocol{font-weight:600;font-size:17px;margin-top:2px;}
  .sheet-badges{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;}
  .badge{font-family:var(--font-mono);font-size:10.5px;padding:3px 8px;border:1px solid var(--line);color:var(--ink-dim);}
  .badge.type{color:#fff8ec;border-color:transparent;}
  .sheet-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;}
  .brief-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);padding:12px 14px;font-size:13.5px;color:var(--ink-dim);line-height:1.5;margin-bottom:18px;}

  .ex-list{display:flex;flex-direction:column;gap:9px;}
  .ex-item{background:var(--surface);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:9px;}
  .ex-item.checked{border-color:var(--accent);}
  .ex-top{display:flex;gap:10px;align-items:flex-start;}
  .ex-idx{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);padding-top:2px;flex-shrink:0;width:24px;font-variant-numeric:tabular-nums;}
  .ex-name-row{flex:1;min-width:0;}
  .ex-name{font-weight:600;font-size:14.5px;}
  .ex-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}
  .ex-tag{font-family:var(--font-mono);font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-dim);border:1px solid var(--line);border-radius:2px;padding:1px 5px;}
  .ex-stats{display:flex;gap:14px;font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-dim);padding-left:34px;}
  .ex-stats b{color:var(--ink);font-weight:600;}
  .ex-cue{font-size:12.5px;color:var(--ink-dim);line-height:1.45;padding-left:34px;}
  .ex-actions{display:flex;gap:10px;padding-left:34px;align-items:center;}
  .check-toggle{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11.5px;cursor:pointer;user-select:none;background:none;border:none;color:var(--ink);padding:2px 0;}
  .check-box{width:20px;height:20px;border:1.5px solid var(--line);border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .check-toggle.on .check-box{background:var(--accent);border-color:var(--accent);}
  .check-toggle.on .check-box::after{content:'\2713';color:var(--accent-ink);font-size:12px;line-height:1;}
  .video-btn{margin-left:auto;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font-family:var(--font-mono);font-size:11px;padding:7px 10px;display:flex;align-items:center;gap:6px;cursor:pointer;}
  .video-btn svg{width:10px;height:10px;fill:var(--ink);}
  .no-video-note{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-dim);opacity:.75;margin-left:auto;}

  /* ---- modals ---- */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,12,4,.72);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s;}
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal-card{background:var(--surface);border:1px solid var(--line);max-width:420px;width:100%;position:relative;}
  .modal-close{position:absolute;top:-14px;right:-14px;width:32px;height:32px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .video-modal-inner{padding:14px;}
  .video-title{font-weight:600;font-size:14.5px;margin-bottom:10px;padding-right:20px;}
  .viewfinder{position:relative;background:#080703;width:100%;max-height:66vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .viewfinder video{display:block;width:auto;height:auto;max-width:100%;max-height:66vh;}
  .vf-corner{position:absolute;width:16px;height:16px;border-color:var(--accent);pointer-events:none;}
  .vf-tl{top:6px;left:6px;border-top:2px solid;border-left:2px solid;}
  .vf-tr{top:6px;right:6px;border-top:2px solid;border-right:2px solid;}
  .vf-bl{bottom:6px;left:6px;border-bottom:2px solid;border-left:2px solid;}
  .vf-br{bottom:6px;right:6px;border-bottom:2px solid;border-right:2px solid;}
  .video-cue{font-size:12.5px;color:var(--ink-dim);margin-top:10px;line-height:1.45;}

  .settings-inner{padding:20px;}
  .settings-inner h2{font-family:var(--font-display);font-size:20px;text-transform:uppercase;margin-bottom:14px;}
  .field-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);display:block;margin-bottom:6px;}
  .field-input{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);padding:10px 12px;font-family:var(--font-body);font-size:14px;margin-bottom:16px;}
  .field-note{font-size:11.5px;color:var(--ink-dim);margin-top:-8px;margin-bottom:16px;line-height:1.4;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:2px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;width:100%;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand-row">
      <div>
        <h1 class="brand">Protocolo 21<em>Calistenia de campo</em></h1>
      </div>
      <button class="operator-btn" id="operatorBtn" type="button">
        <span class="dot" aria-hidden="true"></span>
        <span id="operatorName">Recluta</span>
      </button>
    </div>
    <div class="segbar" id="segbar" role="img" aria-label="Progreso de los 21 días"></div>
    <div class="stats-row">
      <span><b id="statDone">0</b>/21 días completados</span>
      <span><b id="statMin">0</b> min entrenados</span>
    </div>
  </header>

  <div class="tip-bar" id="tipBar" hidden>
    <span id="tipText"></span>
    <button type="button" id="tipClose" aria-label="Cerrar aviso">&times;</button>
  </div>

  <main class="day-list" id="dayList"></main>
</div>

<!-- Day detail sheet -->
<section class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-header">
    <button class="back-btn" id="backBtn" type="button">&larr; Volver al mapa</button>
    <div class="sheet-daynum" id="sheetDayNum"></div>
    <div class="sheet-protocol" id="sheetProtocol"></div>
    <div class="sheet-badges" id="sheetBadges"></div>
  </div>
  <div class="sheet-body">
    <div class="brief-card" id="sheetBrief"></div>
    <div class="ex-list" id="exList"></div>
  </div>
</section>

<!-- Video modal -->
<div class="modal-overlay" id="videoModal">
  <div class="modal-card">
    <button class="modal-close" id="videoClose" aria-label="Cerrar video">&times;</button>
    <div class="video-modal-inner">
      <div class="video-title" id="videoTitle"></div>
      <div class="viewfinder">
        <video id="videoEl" playsinline webkit-playsinline controls preload="none"></video>
        <span class="vf-corner vf-tl"></span><span class="vf-corner vf-tr"></span>
        <span class="vf-corner vf-bl"></span><span class="vf-corner vf-br"></span>
      </div>
      <div class="video-cue" id="videoCue"></div>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-card">
    <button class="modal-close" id="settingsClose" aria-label="Cerrar">&times;</button>
    <div class="settings-inner">
      <h2>Ficha de operador</h2>
      <label class="field-label" for="nameInput">Nombre</label>
      <input class="field-input" id="nameInput" type="text" maxlength="24" placeholder="Recluta">
      <p class="field-note">Se guarda solo en este teléfono. Si cambias de navegador o de equipo, empieza de cero.</p>
      <button class="btn primary" id="saveSettings" type="button">Guardar</button>
    </div>
  </div>
</div>

  var STORAGE_KEY = "protocolo21:v1";
  var TIP_KEY = "protocolo21:tipSeen";
  var TYPE_COLOR = { FUERZA:"var(--type-fuerza)", HIIT:"var(--type-hiit)", MIXTO:"var(--type-mixto)" };

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { name:"Recluta", progress:{} };
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
  var state = loadState();

  function dayProgress(dayNum){
    var arr = state.progress[dayNum];
    var day = DATA.days[dayNum-1];
    if(!arr || arr.length !== day.exercises.length){
      arr = day.exercises.map(function(){ return false; });
      state.progress[dayNum] = arr;
    }
    return arr;
  }
  function isDayDone(dayNum){
    var arr = dayProgress(dayNum);
    return arr.length > 0 && arr.every(Boolean);
  }
  function toggleExercise(dayNum, idx){
    var arr = dayProgress(dayNum);
    arr[idx] = !arr[idx];
    saveState();
    renderTopStats();
    renderDayList();
    renderExerciseList(dayNum);
  }

  function renderTopStats(){
    var seg = document.getElementById("segbar");
    seg.innerHTML = "";
    var doneCount = 0, minutes = 0;
    DATA.days.forEach(function(d){
      var done = isDayDone(d.day);
      if(done){ doneCount++; minutes += d.duration; }
      var i = document.createElement("i");
      if(done) i.className = "done";
      i.title = "Día " + d.day + (done ? " · completado" : "");
      seg.appendChild(i);
    });
    document.getElementById("statDone").textContent = doneCount;
    document.getElementById("statMin").textContent = minutes;
    document.getElementById("operatorName").textContent = state.name || "Recluta";
  }

  function diffDots(n){
    var out = "";
    for(var i=1;i<=5;i++){ out += '<i class="' + (i<=n ? "on" : "") + '"></i>'; }
    return '<span class="diff-dots" aria-label="Dificultad ' + n + ' de 5">' + out + "</span>";
  }

  function renderDayList(){
    var list = document.getElementById("dayList");
    list.innerHTML = "";
    DATA.days.forEach(function(d){
      var done = isDayDone(d.day);
      var card = document.createElement("button");
      card.type = "button";
      card.className = "day-card" + (done ? " done" : "");
      card.setAttribute("aria-label", "Día " + d.day + ", " + d.protocol);
      card.innerHTML =
        '<span class="type-bar" style="background:' + TYPE_COLOR[d.type] + '"></span>' +
        '<span class="body">' +
          (done ? '<span class="done-badge">CUMPLIDA</span>' : "") +
          '<span class="row1"><span class="day-num">' + String(d.day).padStart(2,"0") + '</span></span>' +
          '<span class="protocol-name">' + esc(d.protocol) + '</span>' +
          '<span class="meta-row">' +
            '<span class="type-chip" style="background:' + TYPE_COLOR[d.type] + '">' + d.type + '</span>' +
            '<span>' + d.duration + ' MIN</span>' +
            '<span>' + d.exercises.length + ' EJ.</span>' +
            diffDots(d.difficulty) +
          '</span>' +
        '</span>';
      card.addEventListener("click", function(){ openDay(d.day); });
      list.appendChild(card);
    });
  }

  var currentDay = null;

  function renderExerciseList(dayNum){
    var day = DATA.days[dayNum-1];
    var arr = dayProgress(dayNum);
    var wrap = document.getElementById("exList");
    wrap.innerHTML = "";
    day.exercises.forEach(function(ex, idx){
      var info = DATA.exercises[ex.slug];
      var checked = !!arr[idx];
      var item = document.createElement("div");
      item.className = "ex-item" + (checked ? " checked" : "");
      var tags = (info.tags||[]).map(function(t){ return '<span class="ex-tag">' + esc(t) + '</span>'; }).join("");
      item.innerHTML =
        '<div class="ex-top">' +
          '<span class="ex-idx">' + String(idx+1).padStart(2,"0") + '</span>' +
          '<span class="ex-name-row">' +
            '<span class="ex-name">' + esc(info.name) + '</span>' +
            (tags ? '<span class="ex-tags">' + tags + '</span>' : "") +
          '</span>' +
        '</div>' +
        '<div class="ex-stats"><span><b>' + ex.series + '</b> × <b>' + esc(ex.reps) + '</b></span>' +
          (ex.rest > 0 ? '<span>Descanso <b>' + ex.rest + 's</b></span>' : '<span>Sin descanso</span>') +
        '</div>' +
        (info.cue ? '<div class="ex-cue">' + esc(info.cue) + '</div>' : "") +
        '<div class="ex-actions">' +
          '<button type="button" class="check-toggle' + (checked ? " on" : "") + '" data-idx="' + idx + '">' +
            '<span class="check-box"></span><span>' + (checked ? "Completado" : "Marcar completo") + '</span>' +
          '</button>' +
          (info.video ? '<button type="button" class="video-btn" data-slug="' + esc(ex.slug) + '"><svg viewBox="0 0 10 10"><polygon points="0,0 10,5 0,10"></polygon></svg>VER DEMO</button>' : '<span class="no-video-note">Sin video de referencia</span>') +
        '</div>';
      item.querySelector(".check-toggle").addEventListener("click", function(){ toggleExercise(dayNum, idx); });
      var vbtn = item.querySelector(".video-btn");
      if(vbtn){ vbtn.addEventListener("click", function(){ openVideo(ex.slug); }); }
      wrap.appendChild(item);
    });
  }

  function openDay(dayNum){
    currentDay = dayNum;
    var day = DATA.days[dayNum-1];
    document.getElementById("sheetDayNum").textContent = "DÍA " + String(dayNum).padStart(2,"0");
    document.getElementById("sheetProtocol").textContent = day.protocol;
    document.getElementById("sheetBrief").textContent = day.brief;
    document.getElementById("sheetBadges").innerHTML =
      '<span class="badge type" style="background:' + TYPE_COLOR[day.type] + '">' + day.type + '</span>' +
      '<span class="badge">' + day.duration + ' MIN</span>' +
      '<span class="badge">DIFICULTAD ' + day.difficulty + '/5</span>';
    renderExerciseList(dayNum);
    var sheet = document.getElementById("sheet");
    sheet.classList.add("open");
    sheet.setAttribute("aria-hidden","false");
    history.pushState({ view:"day", day:dayNum }, "", "#dia-" + dayNum);
    sheet.querySelector(".sheet-body").scrollTop = 0;
  }
  function closeDay(fromPop){
    var sheet = document.getElementById("sheet");
    sheet.classList.remove("open");
    sheet.setAttribute("aria-hidden","true");
    currentDay = null;
    if(!fromPop && location.hash.indexOf("#dia-") === 0){ history.back(); }
  }
  document.getElementById("backBtn").addEventListener("click", function(){ closeDay(false); });

  function openVideo(slug){
    var info = DATA.exercises[slug];
    if(!info || !info.video) return;
    document.getElementById("videoTitle").textContent = info.name;
    document.getElementById("videoCue").textContent = info.cue || "";
    var v = document.getElementById("videoEl");
    v.src = info.video;
    var modal = document.getElementById("videoModal");
    modal.classList.add("open");
    v.play().catch(function(){});
  }
  function closeVideo(){
    var modal = document.getElementById("videoModal");
    modal.classList.remove("open");
    var v = document.getElementById("videoEl");
    v.pause();
    v.removeAttribute("src");
    v.load();
  }
  document.getElementById("videoClose").addEventListener("click", closeVideo);
  document.getElementById("videoModal").addEventListener("click", function(e){
    if(e.target === this) closeVideo();
  });

  function openSettings(){
    document.getElementById("nameInput").value = state.name || "";
    document.getElementById("settingsModal").classList.add("open");
  }
  function closeSettings(){ document.getElementById("settingsModal").classList.remove("open"); }
  document.getElementById("operatorBtn").addEventListener("click", openSettings);
  document.getElementById("settingsClose").addEventListener("click", closeSettings);
  document.getElementById("settingsModal").addEventListener("click", function(e){
    if(e.target === this) closeSettings();
  });
  document.getElementById("saveSettings").addEventListener("click", function(){
    var val = document.getElementById("nameInput").value.trim();
    state.name = val || "Recluta";
    saveState();
    renderTopStats();
    closeSettings();
  });

  window.addEventListener("popstate", function(e){
    if(!e.state || e.state.view !== "day"){ closeDay(true); }
  });

  function initTip(){
    var seen = false;
    try{ seen = localStorage.getItem(TIP_KEY) === "1"; }catch(e){}
    if(seen) return;
    var ua = navigator.userAgent || "";
    var isIOS = /iphone|ipad|ipod/i.test(ua);
    var txt = isIOS
      ? "Consejo: toca Compartir ↑ y elige “Agregar a pantalla de inicio” para abrir esto como una app."
      : "Consejo: abre el menú ⋮ del navegador y elige “Agregar a pantalla de inicio” o “Instalar app”.";
    document.getElementById("tipText").textContent = txt;
    document.getElementById("tipBar").hidden = false;
  }
  document.getElementById("tipClose").addEventListener("click", function(){
    document.getElementById("tipBar").hidden = true;
    try{ localStorage.setItem(TIP_KEY, "1"); }catch(e){}
  });

  // init
  history.replaceState({ view:"home" }, "");
  renderTopStats();
  renderDayList();
  initTip();
})();
</script>
